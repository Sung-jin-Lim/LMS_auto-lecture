<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LMS Automation</title>
    <!-- Include Bootstrap CSS for styling (optional) -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <!-- Custom CSS Styles -->
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa; /* Light gray background */
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 500px;
        margin-top: 50px;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
      }
      label {
        font-weight: bold;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      #courseInputs {
        margin-bottom: 20px;
      }
      .btn {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
      }
      .btn-add {
        background-color: #28a745;
        color: white;
      }
      .btn-add:hover {
        background-color: #218838;
      }
      .btn-submit {
        background-color: #007bff;
        color: white;
      }
      .btn-submit:hover {
        background-color: #0069d9;
      }
    </style>
    <!-- JavaScript Function to Add More Course Inputs -->
    <script>
      function addCourseInput() {
        var newDiv = document.createElement("div");
        newDiv.classList.add("course-input");

        var newInput = document.createElement("input");
        newInput.setAttribute("type", "text");
        newInput.setAttribute("name", "course_urls[]");
        newInput.setAttribute(
          "placeholder",
          "Enter course URL (e.g., https://learning.hanyang.ac.kr/courses/158664)"
        );
        newInput.required = true;

        newDiv.appendChild(newInput);
        document.getElementById("courseInputs").appendChild(newDiv);
      }
      function updateProgress() {
        $.getJSON("/progress", function (data) {
          console.log("Received data:", data);
          $("#current_task").text(data.current_task);
          $("#progress_bar")
            .css("width", data.progress + "%")
            .attr("aria-valuenow", data.progress)
            .text(data.progress + "%");

          if (data.is_complete) {
            window.location.href = "/completion"; // Redirect to completion page
          } else {
            setTimeout(updateProgress, 1000); // Fetch progress every second
          }
        });
      }
      updateProgress();
    </script>
  </head>
  <body>
    <div class="container">
      <h1>LMS Automation</h1>
      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">Username (Student ID):</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Enter your username"
          />
        </div>
        <div class="form-group">
          <label for="password">Password (Portal Password):</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>
        <div id="courseInputs">
          <label>Course URLs:</label>
          <div class="course-input">
            <input
              type="text"
              name="course_urls[]"
              placeholder="Enter course URL (e.g., https://learning.hanyang.ac.kr/courses/158664)"
              required
            />
          </div>
        </div>
        <button type="button" class="btn btn-add" onclick="addCourseInput()">
          Add Another Course
        </button>
        <button type="submit" class="btn btn-submit">Login and Automate</button>
      </form>
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery and Bootstrap JS (if you plan to use Bootstrap's JS components) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- If you're not using any Bootstrap JS components, you can omit the following line -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
