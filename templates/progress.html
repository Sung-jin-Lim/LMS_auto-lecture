<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Automation Progress</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <!-- Custom CSS -->
    <style>
      body {
        background-color: #f8f9fa;
      }
      #current_task {
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      .progress {
        height: 30px;
      }
      .progress-bar {
        font-size: 1rem;
        line-height: 30px;
      }
      .spinner-border {
        width: 3rem;
        height: 3rem;
      }
      .btn-disabled {
        pointer-events: none;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5 text-center">
      <h1 class="mb-4">Automation in Progress</h1>
      <div class="d-flex justify-content-center mb-3">
        <div class="spinner-border text-primary" role="status" id="loading-spinner">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
      <p id="current_task" class="text-muted">Starting...</p>
      <div class="progress mx-auto" style="width: 80%">
        <div
          id="progress_bar"
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          style="width: 0%"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          0%
        </div>
      </div>
      <!-- Add the pause/resume and cancel buttons -->
      <div class="mt-4">
        <!-- <button id="pauseButton" class="btn btn-warning" disabled>Pause</button> -->
        <button id="cancelButton" class="btn btn-danger">Cancel</button>
      </div>
    </div>
    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
      var isPausable = false;
      var isPaused = false;

      function updateProgress() {
        $.getJSON("/progress", function (data) {
          console.log("Received data:", data);
          $("#current_task").text(data.current_task);
          $("#progress_bar")
            .css("width", data.progress + "%")
            .attr("aria-valuenow", data.progress)
            .text(data.progress + "%");

          // Update pause button state
          if (
            data.is_pausable === true ||
            data.is_pausable === "True" ||
            data.is_pausable === "true"
          ) {
            $("#pauseButton").removeAttr("disabled");
            isPausable = true;
            console.log("Pause button enabled");
          } else {
            $("#pauseButton").attr("disabled", "disabled");
            isPausable = false;
            console.log("Pause button disabled");
          }

          if (data.is_complete) {
            window.location.href = "/completion"; // Redirect to completion page
          } else {
            setTimeout(updateProgress, 1000); // Fetch progress every second
          }
        });
      }
      updateProgress();

      // Handle cancel button click
      $("#cancelButton").on("click", function () {
        $.post("/cancel", function () {
          window.location.href = "/"; // Redirect to index page after cancellation
        });
      });

      // Handle pause/resume button click
      $("#pauseButton").on("click", function () {
        if (isPaused) {
          // Send resume request
          $.post("/resume", function () {
            isPaused = false;
            $("#pauseButton").text("Pause");
          });
        } else {
          // Send pause request
          $.post("/pause", function () {
            isPaused = true;
            $("#pauseButton").text("Resume");
          });
        }
      });
    </script>
  </body>
</html>
